[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo"
version = "0.1.0"
description = "Battery dispatch optimizer for the German day-ahead market"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "cvxpy>=1.5",
    "highspy>=1.7",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
    "pymodbus>=3.6,<3.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
bdo = "bdo.cli:app"

[tool.setuptools.packages.find]
include = ["bdo*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
