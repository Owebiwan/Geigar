name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy bdo
      - run: pytest -q --cov=bdo/optimizer --cov=bdo/device --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # runs tsc first

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 1800   # first start trains the forecaster
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BDO_UI_URL=http://127.0.0.1:8080 npx playwright test
      - if: failure()
        run: docker compose logs --tail 200
